    <!-- FAQ Structured Data for LLM Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Repo Timeline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Repo Timeline is a free developer tool that turns your GitHub commit history into a visual timeline. It shows merged pull requests and commits with over 100 line changes, displayed on a vertical timeline with AI-generated summaries that explain each change in plain English."
          }
        },
        {
          "@type": "Question",
          "name": "How does Repo Timeline work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sign in with your GitHub account, select a repository and branch, and Repo Timeline fetches your merged PRs and major commits from the GitHub API. Click any event on the timeline to see an AI-powered summary generated by Anthropic Claude that describes what changed and why."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Repo Timeline for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Repo Timeline is built for developers, engineering managers, and anyone who needs to understand the history of a codebase without reading diffs. It is especially useful for teams using AI coding assistants like Cursor, GitHub Copilot, or Claude Code, where codebases evolve quickly with large file changes."
          }
        },
        {
          "@type": "Question",
          "name": "What is vibe coding?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vibe coding is a style of software development where developers use AI coding assistants to generate large amounts of code quickly. This produces rapid, large-scale changes that are difficult to track through traditional commit logs. Repo Timeline was built to solve this problem by summarizing these changes in plain English."
          }
        },
        {
          "@type": "Question",
          "name": "Is Repo Timeline free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Repo Timeline is free and open source. It requires a GitHub account to authenticate and optionally uses the Anthropic Claude API for AI-generated summaries."
          }
        },
        {
          "@type": "Question",
          "name": "What GitHub data does Repo Timeline show?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Repo Timeline shows all merged pull requests and direct commits with more than 100 line changes on a selected branch. Each event displays a short summary, the date, author, lines added and removed, and a link to the original PR or commit on GitHub."
          }
        }
      ]
    }
    </script>
